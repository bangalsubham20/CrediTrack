<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CrediTrack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="favicon.ico">
</head>

<body>
    <header class="dashboard-header">
        <h1>CrediTrack</h1>
        <div class="utility-nav">
            <span>Welcome, <b id="userName">User</b></span>
            <button class="btn" id="logoutBtn" style="width: auto; padding: 0.5rem 1rem;">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="dashboard-actions" style="margin-bottom: 2rem;">
            <button class="btn" id="applyLoanBtn" style="width: auto;">+ Apply for New Loan</button>
        </div>

        <h2>My Loans</h2>
        <div id="loanContainer" class="card-grid">
            <!-- Loans will be injected here -->
            <p>Loading...</p>
        </div>
    </div>

    <!-- Apply Loan Modal -->
    <div class="modal" id="loanModal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Apply for Loan</h2>
            <form id="loanForm">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" min="1000" required>
                </div>
                <div class="form-group">
                    <label>Interest Rate (%)</label>
                    <input type="number" id="rate" step="0.1" required>
                </div>
                <div class="form-group">
                    <label>Tenure (Months)</label>
                    <input type="number" id="tenure" min="1" required>
                </div>
                <button type="submit" class="btn">Submit Application</button>
            </form>
        </div>
    </div>

    <!-- View EMIs Modal -->
    <div class="modal" id="emiModal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-btn">&times;</span>
            <h2>EMI Schedule</h2>
            <table>
                <thead>
                    <tr>
                        <th>Due Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="emiTableBody">
                    <!-- EMIs here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
