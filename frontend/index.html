<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediTrack - Digital Loan & Repayment Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div id="toast-container"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Login Box -->
            <div id="login-box">
                <div class="auth-header">
                    <div class="brand-logo">💳 CrediTrack</div>
                    <p>Sign in to manage loans & repayments</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn" id="loginSubmitBtn">Sign In</button>
                </form>

                <div class="toggle-auth">
                    <p>New to CrediTrack? <a href="#" class="toggle-link">Create an account</a></p>
                </div>
            </div>

            <!-- Register Box -->
            <div id="register-box" style="display: none;">
                <div class="auth-header">
                    <div class="brand-logo">💳 CrediTrack</div>
                    <p>Create your new account</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="Min 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label for="regRole">Account Type</label>
                        <select id="regRole">
                            <option value="CUSTOMER">Customer (Borrower)</option>
                            <option value="LOAN_OFFICER">Loan Officer (Approver)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" id="registerSubmitBtn">Create Account</button>
                </form>

                <div class="toggle-auth">
                    <p>Already have an account? <a href="#" class="toggle-link">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
