<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediTrack - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="auth-container">
        <!-- Login Box -->
        <div class="auth-box" id="login-box">
            <h2>CrediTrack Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="toggle-auth">
                <p>Don't have an account? <a href="#" class="toggle-link">Register here</a></p>
            </div>
        </div>

        <!-- Register Box -->
        <div class="auth-box" id="register-box" style="display: none;">
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <div class="toggle-auth">
                <p>Already have an account? <a href="#" class="toggle-link">Login here</a></p>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
